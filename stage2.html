<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu">
        <div class="game-title">Stage 2</div>
        <h1>What is a Decoder???</h1>
        <img id="clueImage" src="clue4.png" alt="QR Code Clue" class="clue-image" title="Click to download clue4.png">

        <div class="input-group">
            <input type="text" id="answerInput" placeholder="Type your answer...">
            <button id="answerBtn">Submit Answer</button>
        </div>

        <p id="resultMessage" class="player-name"></p>
    </div>
    <div id="jumpscareOverlay" class="jumpscare-overlay" hidden>
        <div class="jumpscare-box">
            <img id="jumpscareImage" class="incorrect-image" src="" alt="Incorrect answer jumpscare">
            <p>Uloooool</p>
            <button id="retryBtn" class="retry-btn">Try Again</button>
        </div>
    </div>

    <script src="stage2.js" defer></script>
</body>
</html>
